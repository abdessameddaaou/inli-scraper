name: Inli Scraper Bot

on:
  repository_dispatch:
    types: [trigger-cron]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requis pour commit le fichier seen_ids.json

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Exécution du scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INLI_SEARCH_URL: ${{ secrets.INLI_SEARCH_URL }}
        run: python scraper.py

      - name: Sauvegarder l'état (annonces vues)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_ids.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Annonces vues" && git push)
