name: Inli Scraper Bot

on:
  # Déclencheur externe (cron-job / worker) — filtré par le job "check" ci-dessous
  repository_dispatch:
    types: [trigger-cron]
  # Planning GitHub : toutes les 5 min, dim-ven en UTC (le job "check" garde uniquement lun-ven heure de Paris)
  schedule:
    - cron: '*/5 * * * 0-5'
  # Lancement manuel : toujours exécuté, même le week-end
  workflow_dispatch:

# Un seul run à la fois : évite les doublons de notifications et les conflits de push
concurrency:
  group: inli-scraper
  cancel-in-progress: false

jobs:
  check:
    name: Vérifier le jour (lun-ven, heure de Paris)
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - id: slot
        run: |
          DAY=$(TZ=Europe/Paris date +%u)    # 1 = lundi ... 7 = dimanche
          echo "Heure de Paris : $(TZ=Europe/Paris date '+%A %d/%m %H:%M')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Lancement manuel : on exécute."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$DAY" -ge 6 ]; then
            echo "Week-end : on ne fait rien."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  scrape-and-notify:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Requis pour commit le fichier seen_ids.json

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Configuration de Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Exécution du scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INLI_SEARCH_URL: ${{ secrets.INLI_SEARCH_URL }}
        run: python scraper.py

      - name: Sauvegarder l'état (annonces vues)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_ids.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle annonce à sauvegarder."
          else
            git commit -m "Auto-update: Annonces vues"
            git pull --rebase
            git push
          fi
